<!doctype html><html><head><meta charset="utf-8"><title>Browser Harness</title></head><body>
<h1>Browser Harness</h1><p>Connect all ordinary web tabs in this profile. Private windows are excluded.</p>
<label>Profile label <input id="label" maxlength="80"></label><p id="status" role="status"></p>
<button id="connect">Connect</button> <button id="disconnect">Disconnect</button>
<p>The native host selects the harness endpoint. Configure it with <code>browser-harness extension configure</code>.</p>
<script src="popup.js"></script></body></html>
